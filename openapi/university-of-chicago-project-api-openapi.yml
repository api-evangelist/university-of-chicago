components:
  schemas:
    schema_links:
      properties:
        links:
          items:
            type: string
          type: array
      required:
      - links
      type: object
    schema_project:
      properties:
        code:
          type: string
        dbgap_accession_number:
          type: string
        investigator_name:
          type: string
        name:
          type: string
        type:
          type: string
      required:
      - name
      - code
      type: object
