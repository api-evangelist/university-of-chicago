- aid: university-of-chicago:shibboleth-idp-metadata
  name: University of Chicago Shibboleth Identity Provider — InCommon SAML Metadata
  description: >-
    The University of Chicago's Shibboleth identity provider publishes its SAML 2.0 metadata document
    publicly. entityID urn:mace:incommon:uchicago.edu places the institution in the InCommon federation
    and therefore in eduGAIN. The document carries an IDPSSODescriptor supporting the SAML 2.0 protocol,
    HTTP-Redirect and HTTP-POST SingleSignOnService bindings at https://shibboleth2.uchicago.edu/saml2/idp/SSOService.php,
    the transient NameID format, signing and encryption key descriptors, and md:OrganizationName "University
    of Chicago". This is the surface class a university operates by definition and it is machine-readable
    — verified live 2026-08-19, HTTP 200, application/xml.
  humanURL: https://its.uchicago.edu/
  baseURL: https://shibboleth2.uchicago.edu/idp/shibboleth
  x-operator: institution
  x-operator-basis: >-
    Host shibboleth2.uchicago.edu is under the institution's own registrable domain uchicago.edu.
  x-verified: '2026-08-19'
  tags:
