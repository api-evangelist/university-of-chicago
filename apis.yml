aid: university-of-chicago
name: University of Chicago
description: >-
  The University of Chicago is a private research university in Chicago, Illinois, founded in 1890.
  It operates no central developer portal and publishes no institution-wide API programme, and the
  one gated portal it does run — an Azure API Management front end for Azure OpenAI at
  ai-api-portal-dev.uchicago.edu — serves a certificate that does not match its own hostname and,
  with verification disabled, answers a bare Azure Application Gateway 404, so it is not a public
  surface. What it does operate is
  unusually real for a university, because UChicago is a genuine PRODUCER of open-source data
  infrastructure rather than only a buyer of it: the Center for Translational Data Science (CTDS,
  github.com/uc-cdis) authors the Gen3 data-commons platform and runs its own reference commons at
  gen3.datacommons.io, a domain registered to CDIS at the University. The OpenAPI documents in this
  repository are CTDS's own contracts (info.contact cdis@uchicago.edu, termsOfService
  cdis.uchicago.edu), not a vendor's running under the institution's name. Alongside that the
  institution operates a Shibboleth identity provider whose InCommon SAML metadata is public
  (entityID urn:mace:incommon:uchicago.edu), Knowledge@UChicago on self-hosted InvenioRDM 13.1 with a
  live REST API and an OAI-PMH 2.0 responder advertising DataCite metadata, the OCHRE ancient-studies
  data service, and IIIF Presentation 3.0 and Image 2.0 endpoints for library digital collections.
  Course catalog and registrar data remain behind PeopleSoft authentication, the VuFind catalog API
  is deployed with its API permissions denied, and there is no open-data portal — data.uchicago.edu
  is the Office of Institutional Analysis's reporting site, not a machine-readable catalog.
