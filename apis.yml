- aid: university-of-chicago:knowledge-oai-pmh
  name: Knowledge@UChicago OAI-PMH Endpoint
  description: >-
    OAI-PMH 2.0 harvesting endpoint for the University of Chicago institutional repository. ?verb=Identify
    returns repositoryName "UChicago Knowledge", protocolVersion 2.0, granularity YYYY-MM-DDThh:mm:ssZ
    and adminEmail info@knowledge.uchicago.edu; ?verb=ListMetadataFormats advertises oai_dc, datacite,
    marcxml, marc21 and dcat. earliestDatestamp is 2026-05-22, which dates the current platform rather
    than the collection. OAI-PMH is a named standard of the Kin Score education regime and this endpoint
    is a verified conformance hit.
