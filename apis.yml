x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  generated: '2026-08-19'
  method: probed
  detail: >-
    The University of Chicago publishes no central developer portal, but it is one of the few
    institutions in this cohort that genuinely PRODUCES machine-readable infrastructure rather than
    only consuming a vendor's. Seven institution-operated surfaces were verified live on 2026-08-19:
    the Shibboleth/InCommon SAML metadata document, the Knowledge@UChicago InvenioRDM REST API, the
    Knowledge@UChicago OAI-PMH 2.0 responder, the OCHRE ancient-studies data service, the Library
    IIIF Presentation 3.0 manifest service, the Library IIIF Image 2.0 (Loris) server, and the CTDS
    reference Gen3 data commons at gen3.datacommons.io. Zero vendor-operated contracts and zero
    tenant relationships were found — this repository holds no Figshare, Pure, Ex Libris, Dataverse
    or Symplectic surface, and none was removed to reach that state. Every OpenAPI document held here
    is authored by the University's own Center for Translational Data Science (info.contact
    cdis@uchicago.edu, info.termsOfService cdis.uchicago.edu), which is why they survive the operator
    check that eliminated the rest of the cohort's artifacts.
  gaps:
  - surface_class: Course Catalog
    state: gated
    detail: >-
      coursesearch.uchicago.edu redirects to a PeopleSoft (Oracle Campus Solutions) guest login at
      coursesearch92.ais.uchicago.edu. No machine-readable course, section or timetable feed is
      exposed. collegecatalog.uchicago.edu does not accept connections at all.
    evidence:
    - url: https://coursesearch.uchicago.edu/
      status: 200
      note: redirects to PeopleSoft login — HTML only, no data surface
    - url: https://collegecatalog.uchicago.edu/
      status: 0
      note: connection refused
  - surface_class: Library Catalog API
    state: gated
    detail: >-
      VuFind is deployed at catalog.lib.uchicago.edu and forked in the institution's own GitHub
      organization, but its REST API is switched off.
    evidence:
    - url: https://catalog.lib.uchicago.edu/vufind/api/v1/search?lookfor=test&limit=1
      status: 403
      note: '{"status":"ERROR","statusMessage":"Permission denied"}'
  - surface_class: Open Data Portal
    state: none
    detail: >-
      No CKAN, Socrata or DCAT catalog is operated. data.uchicago.edu is the Office of Institutional
      Analysis's reporting site — HTML dashboards, no machine-readable catalog and no API.
    evidence:
    - url: https://data.uchicago.edu/
      status: 200
      note: institutional-analysis reporting site, not a data catalog
  - surface_class: Developer Portal
    state: unreadable
    detail: >-
      The University's Azure API Management front end for Azure OpenAI, ai-api-portal-dev.uchicago.edu,
      does not present a valid certificate for its own hostname and, with verification disabled,
      returns a bare Microsoft-Azure-Application-Gateway 404. It is a real internal facility for
      faculty and staff, and it is not a public surface. NOT emitted as a pointer.
    evidence:
    - url: https://ai-api-portal-dev.uchicago.edu/
      status: 0
      note: 'SSL: no alternative certificate subject name matches target host name'
    - url: https://ai-api-portal-dev.uchicago.edu/
      status: 404
      note: with certificate verification disabled — Microsoft-Azure-Application-Gateway/v2
  defects_corrected:
  - defect: fabricated_base_url
    detail: >-
      All 38 apis[] entries carried baseURL https://iiif-manifest.lib.uchicago.edu/ — the Library's
      IIIF manifest host stamped onto 37 Gen3 API entries that have nothing to do with it. Repaired
      to the verified CTDS commons https://gen3.datacommons.io/.
  - defect: soft_404_host_credited_as_live
    detail: >-
      iiif-manifest.lib.uchicago.edu answers HTTP 200 with the body "The requested resource is
      unavailable." for every path tested, including a valid ARK (ark:61001/b2p35sm3m743) that
      resolves correctly on iiif-collection.lib.uchicago.edu. The host was the repository's only
      recorded institution-owned host and it is dead. Replaced with the two IIIF hosts that answer.
  - defect: placeholder_servers_block
    detail: >-
      All 37 refined OpenAPI documents declared servers[0].url https://example.domain/ — the upstream
      Gen3 placeholder, present because Fence/indexd/sheepdog/peregrine are deployable software.
      Repaired to the deployment CTDS itself operates, with x-operator and probe evidence recorded on
      the server object rather than asserted.
  - defect: wrong_service_attribution_in_contracts
    detail: >-
      All 37 refined documents carried info.title "Fence OpenAPI Specification ..." and the Fence
      description, including the 10 indexd, 7 Sheepdog and 3 Peregrine documents. Corrected by
      matching each document's paths back to the four pristine sources in openapi/_original/ — a
      100% path match for every document — and retitling to the correct Gen3 service. apis[] entries
      now carry x-surface-group naming the parent service, so the footprint reads as four Gen3
      services split by tag rather than 37 unrelated University APIs.
  - defect: dead_terms_of_service_in_contract
    detail: >-
      Every Gen3 contract declares info.termsOfService http://cdis.uchicago.edu/terms/, which returns
      HTTP 404. The host cdis.uchicago.edu is live; the terms path is gone. Left in place because it
      is the institution's own declaration and correcting it would be fabricating a document — but no
      TermsOfService pointer is emitted in common[] on the strength of it.
  evidence:
  - url: https://shibboleth2.uchicago.edu/idp/shibboleth
    status: 200
  - url: https://knowledge.uchicago.edu/api/records?size=1
    status: 200
  - url: https://knowledge.uchicago.edu/oai2d?verb=Identify
    status: 200
  - url: https://knowledge.uchicago.edu/oai2d?verb=ListMetadataFormats
    status: 200
  - url: https://ochre.lib.uchicago.edu/ochre?uuid=e5e9d6aa-1e63-461a-a8b3-0ee3ac1b2418
    status: 200
  - url: https://pi.lib.uchicago.edu/1001/org/ochre/e5e9d6aa-1e63-461a-a8b3-0ee3ac1b2418
    status: 200
  - url: https://iiif-collection.lib.uchicago.edu/object/ark:61001/b2p35sm3m743.json
    status: 200
  - url: https://iiif-server.lib.uchicago.edu/
    status: 200
  - url: https://gen3.datacommons.io/.well-known/openid-configuration
    status: 200
  - url: https://gen3.datacommons.io/index/index
    status: 200
  - url: https://gen3.datacommons.io/api/v0/submission/_dictionary/_all
    status: 200
  - url: https://gen3.datacommons.io/mds/metadata
    status: 200
  - url: https://gen3.datacommons.io/guppy/_status
    status: 200
  - url: https://iiif-manifest.lib.uchicago.edu/ark:61001/b2p35sm3m743
    status: 200
    note: soft-404 — HTTP 200 with an error body
  - url: https://api.uchicago.edu/
    status: 200
    note: soft-404 — IT Services "URL Reserved" placeholder page
  - url: https://its.uchicago.edu/zzz-nonsense-path-xyz
    status: 200
    note: soft-404 — identical shell served for every path; no its.uchicago.edu pointer emitted
  - url: https://privacy.uchicago.edu/privacy-policy/
    status: 200
    note: client-rendered SPA; path-level verification not possible, pointer retained as the link the institution's own homepage emits
  - url: https://catalog.lib.uchicago.edu/vufind/api/v1/search?lookfor=test&limit=1
    status: 403
  - url: https://iiif-image.lib.uchicago.edu/
    status: 403
    note: blocked to us, live to the Library's own viewers
  - url: https://www.lib.uchicago.edu/iiif_files/
    status: 200
    note: Turnstile bot challenge — live, not readable

