- aid: university-of-chicago:ochre-data-service
  name: OCHRE Data Service API
  description: >-
    OCHRE (Online Cultural and Historical Research Environment) is the University of Chicago's item-level
    research database for ancient studies, maintained by the OCHRE Data Service at the Institute for the
    Study of Ancient Cultures. Published items are retrievable as XML by UUID from the institution's own
    host, and resolvable through the Library's persistent-identifier service at pi.lib.uchicago.edu/1001/org/ochre/{uuid}.
    Verified live 2026-08-19 — a real UUID returned HTTP 200, text/xml, 106KB of item data.
  humanURL: https://ochre.uchicago.edu/
  baseURL: https://ochre.lib.uchicago.edu/ochre
  x-operator: institution
  x-operator-basis: >-
    Hosts ochre.lib.uchicago.edu and pi.lib.uchicago.edu are under the institution's own registrable domain
    uchicago.edu.
  x-verified: '2026-08-19'
