- aid: university-of-chicago:library-iiif-presentation
  name: University of Chicago Library IIIF Presentation API
  description: >-
    IIIF Presentation API 3.0 manifests for the University of Chicago Library's digital collections, addressed
    by ARK (naming authority 61001) at iiif-collection.lib.uchicago.edu/object/ark:61001/{arkid}.json.
    Manifests declare the IIIF Presentation 3 context, embed the IIIF Image 2 context, and carry a requiredStatement
    attributing the University of Chicago. Verified live 2026-08-19 — HTTP 200, application/json, 99KB
    manifest; a nonsense ARK returns a real HTTP 404. NOTE: the older manifest host iiif-manifest.lib.uchicago.edu,
    which this repository previously recorded as the base URL for every entry, is dead — it answers HTTP
    200 with a soft-404 body for every path including valid ARKs.
  humanURL: https://www.lib.uchicago.edu/
  baseURL: https://iiif-collection.lib.uchicago.edu/
  x-operator: institution
  x-operator-basis: >-
    Host iiif-collection.lib.uchicago.edu is under the institution's own registrable domain uchicago.edu.
  x-verified: '2026-08-19'
  tags:
